# pyproject.toml

[build-system]
requires = ["uv_build>=0.12.0,<0.13.4"]
build-backend = "uv_build"

[project]
dynamic = ["dependencies"]
name = "smog_usage_stats"
version = "1.1.0"
readme = "README.md"
authors = [{ name = "stu.gotz.dev", email = "gotz.stu.dev@gmail.com" }]
license-files = ["LICENSE"]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
keywords = ["pokemon", "usage", "pokemon showdown", "smogon"]
requires-python = ">=3.10"

[tools.setuptools]
packages = ["src"]

[tool.setuptools.dynamic]
dependencies = [
    "beautifulsoup4>=4.11",
    "requests>=2.28",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = ["black", "bumpver", "isort", "pytest"]

[tool.bumpver]
current_version = "1.1.0"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "bump version {old_version} -> {new_version}"
commit = true
tag = true
push = true

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'current_version = "{version}"',
    'version = "{version}"'
]
"src/smog_usage_stats/__init__.py" = ["{version}"]

[project.scripts]
smog-usage-stats = "smog_usage_stats.cli:app"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
